<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- NPU Hexagon Cyan/Blue Gradient -->
    <linearGradient id="cyanBlueGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>

    <!-- Crimson Snapdragon Fire Gradient -->
    <linearGradient id="crimsonFireGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#E60012" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Inner Facet Fill -->
    <linearGradient id="facetGradH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter for Neon Highlights -->
    <filter id="neonGlowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g id="mark" transform="translate(130, 120)">
    <!-- Outer Hexagon Frame -->
    <polygon points="0,-85 73,-42 73,42 0,85 -73,42 -73,-42"
             fill="url(#facetGradH)"
             stroke="url(#cyanBlueGradH)"
             stroke-width="8"
             stroke-linejoin="round" />

    <!-- Inner Hexagon Ring -->
    <polygon points="0,-68 58,-34 58,34 0,68 -58,34 -58,-34"
             fill="none"
             stroke="#334155"
             stroke-width="2"
             stroke-dasharray="4,4"
             opacity="0.7" />

    <!-- Neural Circuit Traces -->
    <g id="neuralCircuitH" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M 16,-24 L 42,-24 L 56,-12" fill="none" />
      <circle cx="56" cy="-12" r="3.5" fill="#00F0FF" />

      <path d="M 22,0 L 48,0 L 62,12" fill="none" />
      <circle cx="62" cy="12" r="3.5" fill="#00F0FF" />

      <path d="M 12,28 L 36,28 L 50,42" fill="none" />
      <circle cx="50" cy="42" r="3.5" fill="#00F0FF" />
    </g>

    <!-- Central Speed Bolt -->
    <polygon points="5,-98 -40,-6 0,-6 -22,98 46,0 5,0"
             fill="url(#crimsonFireGradH)"
             stroke="#FF6B8B"
             stroke-width="2.5"
             stroke-linejoin="round"
             filter="url(#neonGlowH)" />
  </g>

  <!-- Typography & Tagline Group -->
  <g id="brandTypography" transform="translate(260, 120)">
    <!-- Brand Title -->
    <text x="0" y="10" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">SnapEdge<tspan dx="14" fill="url(#crimsonFireGradH)">AI</tspan></text>
    
    <!-- Subtitle / Architecture Badge -->
    <text x="4" y="52" font-family="'Space Mono', 'Consolas', monospace" font-size="15" font-weight="700" fill="#00F0FF" letter-spacing="3">45 TOPS HEXAGON NPU &bull; ON-DEVICE COPILOT</text>
  </g>
</svg>
